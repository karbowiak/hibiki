name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install isolated renderer test browsers
        run: bunx --no-install playwright install --with-deps chromium webkit
      - name: Check production renderer features and CSP enforcement
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:renderer
      - name: Check library layouts and keyboard focus
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun scripts/check-library-layout.ts
      - name: Check personalized search discovery and keyboard navigation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:search-discovery
      - name: Check notification interactions and layouts
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:notifications
      - name: Check appearance settings and detail interactions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:appearance
      - name: Upload renderer layout failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: library-layout-failures
          path: |
            .tmp/library-layout-checks/*.png
            .tmp/notification-checks/*.png
            .tmp/search-discovery-checks/*.png
            .tmp/appearance-checks/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  check:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
          - runner: macos-latest
          - runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config \
            cmake \
            file \
            desktop-file-utils \
            appstream \
            zsync

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check and build frontend
        run: bun run build

      - name: Run frontend regression tests
        run: bun run test:frontend

      - name: Check Rust compilation
        working-directory: src-tauri
        env:
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        run: cargo check --locked --all-features

      - name: Run Rust unit tests
        env:
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        run: bun run test:unit

      - name: Run patched container reader regressions
        working-directory: src-tauri
        run: cargo test --locked -p symphonia-format-ogg -p symphonia-format-isomp4

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|karbowiak|hibiki|latest|Hibiki_*_amd64.AppImage.zsync
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        run: bun run tauri build --debug --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Validate relocated AppImage metadata
        if: runner.os == 'Linux'
        run: python3 scripts/check-appimage.py --prepare-zsync src-tauri/target/debug/bundle/appimage/*.AppImage
