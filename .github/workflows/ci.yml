name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install isolated renderer test browsers
        run: bunx --no-install playwright install --with-deps chromium webkit
      - name: Check production renderer features and CSP enforcement
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:renderer
      - name: Check library layouts and keyboard focus
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun scripts/check-library-layout.ts
      - name: Check personalized search discovery and keyboard navigation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:search-discovery
      - name: Check notification interactions and layouts
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:notifications
      - name: Check virtual collections and persistent queue
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun scripts/check-virtual-collections.ts
      - name: Check playlist information and quick hover panels
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun scripts/check-playlist-information.ts
      - name: Check appearance settings and detail interactions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run bun run test:appearance
      - name: Upload renderer layout failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: library-layout-failures
          path: |
            .tmp/library-layout-checks/*.png
            .tmp/notification-checks/*.png
            .tmp/search-discovery-checks/*.png
            .tmp/appearance-checks/*.png
            .tmp/virtual-checks/*.png
            .tmp/information-checks/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  check:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
          - runner: macos-latest
          - runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config \
            cmake \
            appstream

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check and build frontend
        run: bun run build

      - name: Run frontend regression tests
        run: bun run test:frontend

      - name: Check Rust compilation
        working-directory: src-tauri
        env:
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        run: cargo check --locked --all-features

      - name: Run Rust unit tests
        env:
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        run: bun run test:unit

      - name: Run patched decoder and container reader regressions
        working-directory: src-tauri
        run: cargo test --locked -p symphonia-bundle-mp3 -p symphonia-bundle-flac -p symphonia-format-ogg -p symphonia-format-isomp4

      # Source checks stay cheap; release.yml validates the actual signed,
      # relocated AppImage before publishing any installers.
      - name: Validate Linux AppStream metadata
        if: runner.os == 'Linux'
        env:
          TAURI_ENV_PLATFORM: linux
          TAURI_ENV_DEBUG: "true"
        run: |
          bun scripts/prepare-linux-metadata.ts
          appstreamcli validate --no-net .tmp/linux-metadata/app.hibiki.client.metainfo.xml
