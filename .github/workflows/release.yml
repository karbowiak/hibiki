name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.5.2)
        required: true
        type: string
      publish_only:
        description: Revalidate and publish an existing complete draft without rebuilding installers
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      commit: ${{ steps.get-version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Get version from tag
        id: get-version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v0.5.2, got: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Require passing CI for the exact tagged commit
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.get-version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.get-version.outputs.commit }}
        with:
          script: |
            const { assertCI } = require('./scripts/check-release.cjs')
            await assertCI(github, context.repo, process.env.RELEASE_TAG, process.env.RELEASE_COMMIT)

      - name: Create or reuse draft release
        id: create-release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
          RELEASE_TAG: ${{ steps.get-version.outputs.tag }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            const fs = require('fs')
            const notes = `releases/${process.env.VERSION}.md`
            const hasNotes = fs.existsSync(notes)
            const body = hasNotes
              ? fs.readFileSync(notes, 'utf8')
              : '*This release was generated automatically using GitHub Actions.*'
            // Listing releases includes drafts; getReleaseByTag only promises published releases.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            })
            const matching = releases.filter(release => release.tag_name === tag)
            // A stale draft and a published release can share a tag. Never let
            // the API's listing order bypass the published-version boundary.
            if (matching.some(release => !release.draft)) {
              throw new Error(`Release ${tag} is already published; refusing to replace its assets. Use a new version tag.`)
            }
            const existing = matching.find(release => release.draft)
            if (existing) {
              if (hasNotes) await github.rest.repos.updateRelease({ ...context.repo, release_id: existing.id, tag_name: tag, draft: true, body })
              return existing.id
            }
            if (process.env.PUBLISH_ONLY === 'true') {
              throw new Error(`No existing draft for ${tag}; publish-only cannot build missing installers.`)
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Hibiki v${process.env.VERSION}`,
              body,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    if: ${{ !inputs.publish_only }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.commit }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev \
            libssl-dev \
            pkg-config \
            cmake \
            file \
            desktop-file-utils \
            appstream \
            zsync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Patch version in config files
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);

            console.log('Patched version to ' + v);
          "

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LDAI_UPDATE_INFORMATION: ${{ runner.os == 'Linux' && 'gh-releases-zsync|karbowiak|hibiki|latest|Hibiki_*_amd64.AppImage.zsync' || '' }}
          PI_KEY: ${{ secrets.PI_KEY }}
          PI_SECRET: ${{ secrets.PI_SECRET }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Verify and sign macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          images=(src-tauri/target/"$RUST_TARGET"/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]] || { echo "Expected exactly one DMG" >&2; exit 1; }
          hdiutil verify "${images[0]}"
          bun run tauri signer sign --app-version "$VERSION" "${images[0]}"

      - name: Upload verified macOS disk image signature
        if: runner.os == 'macOS'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const { uploadDmgSignature } = require('./scripts/dmg-release.cjs')
            const directory = `src-tauri/target/${process.env.RUST_TARGET}/release/bundle/dmg`
            const images = fs.readdirSync(directory).filter(name => name.endsWith('.dmg'))
            if (images.length !== 1) throw Error('Expected exactly one verified DMG')
            await uploadDmgSignature(github, context.repo, Number(process.env.RELEASE_ID),
              process.env.RELEASE_TAG, path.join(directory, images[0]))

      - name: Validate relocated AppImage metadata
        if: runner.os == 'Linux'
        run: python3 scripts/check-appimage.py --prepare-zsync src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload verified AppImageUpdate companion
        if: runner.os == 'Linux'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        with:
          script: |
            const { uploadCompanion } = require('./scripts/appimage-release.cjs')
            const tag = process.env.RELEASE_TAG
            const image = `src-tauri/target/release/bundle/appimage/Hibiki_${tag.slice(1)}_amd64.AppImage`
            await uploadCompanion(github, context.repo, Number(process.env.RELEASE_ID), tag, image)

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && (needs.build-tauri.result == 'success' || (inputs.publish_only && needs.build-tauri.result == 'skipped')) }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.commit }}

      - name: Verify tag, current CI and signed updater artifacts
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.create-release.outputs.commit }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { assertCI, assertArtifacts } = require('./scripts/check-release.cjs')
            const config = require('./src-tauri/tauri.conf.json')
            await assertCI(github, context.repo, process.env.RELEASE_TAG, process.env.RELEASE_COMMIT)
            const count = await assertArtifacts(github, context.repo, process.env.RELEASE_TAG,
              Number(process.env.RELEASE_ID), config.plugins.updater.pubkey)
            core.info(`Verified all updater platforms and ${count} signed installer artifacts.`)

      - name: Install AppImage metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils zsync

      - name: Download the signed AppImage and update companion
        uses: actions/github-script@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        with:
          script: |
            const { downloadUpdateArtifacts } = require('./scripts/appimage-release.cjs')
            await downloadUpdateArtifacts(github, context.repo, Number(process.env.RELEASE_ID),
              process.env.RELEASE_TAG, '.tmp/appimage-release-check')

      - name: Require published-byte AppStream and AppImageUpdate integrity
        run: |
          # HTTP downloads do not retain filesystem execute permissions.
          # Signatures/digests have been checked before this local mode change.
          chmod u+x .tmp/appimage-release-check/*.AppImage
          python3 scripts/check-appimage.py .tmp/appimage-release-check/*.AppImage

      - name: Publish release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.create-release.outputs.commit }}
        with:
          script: |
            const { assertCI } = require('./scripts/check-release.cjs')
            await assertCI(github, context.repo, process.env.RELEASE_TAG, process.env.RELEASE_COMMIT)
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              tag_name: process.env.RELEASE_TAG,
              draft: false,
              prerelease: false
            })
