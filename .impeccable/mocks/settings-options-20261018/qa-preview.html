  (function () {

    const states = [&#x27;sections&#x27;,&#x27;tabs&#x27;,&#x27;inspector&#x27;].map(function(design) {
      return { design:design,page:&#x27;plex&#x27;,tab:&#x27;cache&#x27;,detail:&#x27;cache&#x27;,source:&#x27;Deezer&#x27;,sourceView:false,expanded:null,order:initialSources.map(function(s){return s.slice();}),notice:&#x27;&#x27;,cleared:{},pending:null,library:&#x27;Music&#x27;,language:&#x27;English&#x27;,notifications:true,correction:true };
    });
    function escapeText(value) { return String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,function(c){ return {&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]; }); }

      const all=navigation.flatMap(function(g){return g[1];}).concat([[&#x27;about&#x27;,&#x27;About&#x27;],[&#x27;eggs&#x27;,&#x27;Easter eggs&#x27;]]);
      out+=&#x27;&lt;div class=&quot;hb-mobile-nav&quot;&gt;&lt;strong&gt;Settings&lt;/strong&gt;&lt;select class=&quot;hb-select&quot; data-select=&quot;page&quot; aria-label=&quot;Settings page&quot;&gt;&#x27;+all.map(function(item){return &#x27;&lt;option value=&quot;&#x27;+item[0]+&#x27;&quot;&#x27;+(s.page===item[0]?&#x27; selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+item[1]+&#x27;&lt;/option&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/div&gt;&#x27;;
      return out;
    }
    function head(s,title,description,status) { return &#x27;&lt;header class=&quot;hb-head&quot;&gt;&lt;div&gt;&lt;h1&gt;&#x27;+title+&#x27;&lt;/h1&gt;&lt;p&gt;&#x27;+description+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+(status?&#x27;&lt;span class=&quot;hb-status&quot;&gt;&lt;span class=&quot;hb-dot&quot;&gt;&lt;/span&gt;&#x27;+status+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/header&gt;&#x27;; }
    function clearControl(s,key,label) {

    function cacheRows(s,service) {

      return box(
        row(&#x27;Playback cache&#x27;,s.cleared[audio]?&#x27;No cached songs&#x27;:plex?&#x27;3.5 GB · 260 tracks&#x27;:&#x27;820 MB · 64 songs&#x27;,clearControl(s,audio,tag+&#x27; playback cache&#x27;))+
        confirmation(s,audio,tag+&#x27; playback cache&#x27;)+
        row(plex?&#x27;Saved library data&#x27;:&#x27;Library &amp; discovery&#x27;,s.cleared[data]?&#x27;No saved pages&#x27;:plex?&#x27;Playlists, rated music and visited pages&#x27;:&#x27;36 saved pages · Library, mixes and recommendations&#x27;,clearControl(s,data,tag+&#x27; saved pages&#x27;))+
        confirmation(s,data,tag+&#x27; saved pages&#x27;)+
        row(&#x27;Artwork&#x27;,s.cleared[art]?&#x27;No cached artwork&#x27;:plex?&#x27;180 MB · From your Plex server&#x27;:&#x27;52 MB · From YouTube Music&#x27;,clearControl(s,art,tag+&#x27; artwork&#x27;))+
        confirmation(s,art,tag+&#x27; artwork&#x27;)
      )+&#x27;&lt;p class=&quot;hb-note&quot;&gt;Playback cache shares a &#x27;+shared.cacheLimit+&#x27; limit. &lt;button type=&quot;button&quot; data-page=&quot;storage&quot;&gt;Manage shared storage&lt;/button&gt;&lt;/p&gt;&#x27;;

    function connection(s,service) {

    function library(s,service) {

        row(&#x27;Matching index&#x27;,&#x27;Ready · Artists, releases and recordings&#x27;,button(&#x27;Manage…&#x27;,&#x27;data-action=&quot;matching&quot;&#x27;))+

    function downloads(s) { return box(row(&#x27;Downloads folder&#x27;,&#x27;Music / Hibiki · 97 songs · 2.26 GB&#x27;,button(&#x27;Open folder&#x27;,&#x27;data-action=&quot;folder&quot;&#x27;))+row(&#x27;Download location&#x27;,&#x27;Saved music stays until you remove it&#x27;,button(&#x27;Change…&#x27;,&#x27;data-action=&quot;download-location&quot;&#x27;))); }
    function serviceContent(s) {
      const service=s.page,plex=service===&#x27;plex&#x27;,tag=plex?&#x27;Plex&#x27;:&#x27;YouTube Music&#x27;;
      let out=head(s,tag,plex?&#x27;Your server, music library and saved data.&#x27;:&#x27;Your account, library and saved data.&#x27;,plex?&#x27;Connected&#x27;:shared.signedIn?&#x27;Signed in&#x27;:&#x27;&#x27;);
      if (!plex&amp;&amp;!shared.signedIn) return out+&#x27;&lt;div class=&quot;hb-empty&quot;&gt;&#x27;+icon(&#x27;circle-play&#x27;)+&#x27;&lt;h2&gt;Connect YouTube Music&lt;/h2&gt;&lt;p&gt;Bring your library, playlists and recommendations into Hibiki.&lt;/p&gt;&#x27;+button(&#x27;Sign in with YouTube Music&#x27;,&#x27;data-action=&quot;sign-in&quot;&#x27;,true)+&#x27;&lt;/div&gt;&#x27;;

        out+=&#x27;&lt;div class=&quot;hb-service-summary&quot;&gt;&lt;div&gt;&lt;strong&gt;&#x27;+(plex?&#x27;Home server&#x27;:tag)+&#x27;&lt;/strong&gt;&lt;small&gt;&#x27;+(plex?s.library+&#x27; library · Connected&#x27;:&#x27;Account connected · Session refreshed automatically&#x27;)+&#x27;&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;hb-status&quot;&gt;&#x27;+icon(&#x27;check&#x27;)+&#x27;Ready&lt;/span&gt;&lt;/div&gt;&#x27;;

      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
