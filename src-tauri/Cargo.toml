[package]
name = "hibiki"
version = "0.1.0"
description = "Hibiki — Plex music client"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["macos-private-api", "devtools"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-notification = "2.7.0"
souvlaki = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Async runtime
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
# Embedded durable jobs. SQLite only; no broker or separate worker executable.
butler = { package = "butler-jobs", version = "=0.1.0", default-features = false, features = ["sqlite", "tokio"] }

# HTTP client with retry logic
# Preserve the native TLS, text decoding, HTTP/2, and system proxy behavior of 0.11.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "query", "form"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "query"] }
reqwest-retry = "0.9.1"
encoding_rs = "0.8.42"
mime = "0.3.17"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4.45", features = ["serde"] }

# URL handling
url = "2.5.8"

# Cryptography
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"

# Utilities
once_cell = "1.21.4"
moka = { version = "0.12.16", features = ["sync", "future"] }
uuid = { version = "1.28.0", features = ["v4"] }
roxmltree = "0.21.1"
scraper = "0.27.0"
crossbeam-channel = "0.5.17"

# SQLite database
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Cross-platform audio device enumeration & playback
cpal = "0.18.2"

# Audio decoding — AAC uses FDK and a streaming ADTS reader registered by Hibiki.
symphonia = { version = "0.6.1", default-features = false, features = [
    "all-meta", # ID3/APE readers are separate opt-in features in Symphonia 0.6.
    "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "caf", "isomp4", "mkv", "ogg", "aiff", "wav",                    # formats
] }
opusic-sys = "0.7.5"
fdk-aac-sys = "0.5.0"

# EBU R128 loudness analysis (for Opus tracks where Plex lacks proper loudness data)
ebur128 = "0.1.10"

# FFT for visualizer frequency analysis
realfft = "3.5.0"
rubato = "5.0.1"
tempfile = "3.27.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "pnm"] }
tauri-plugin-opener = "2.7.2"
unicode-normalization = "0.1.26"

[dev-dependencies]
tokio-test = "0.4.6"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# Artwork cache hits hash validated bytes; keep that hot path fast in the dev app.
[profile.dev.package.sha2]
opt-level = 3

[target.'cfg(unix)'.dependencies]
# Portable O_NOFOLLOW/O_NONBLOCK flags for opening only actual cached files.
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block = "0.1.6"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# Upstream Windows updater still pins ZIP 4, which has fixed advisories in ZIP 9.
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
symphonia-format-ogg = { path = "vendor/symphonia-format-ogg" }
symphonia-format-mkv = { path = "vendor/symphonia-format-mkv" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
block = { path = "vendor/block" }
