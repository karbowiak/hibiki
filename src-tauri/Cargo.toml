[package]
name = "hibiki"
version = "0.1.0"
description = "Hibiki — Plex music client"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["macos-private-api", "devtools"] }
tauri-plugin-shell = "2.4.1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2.13.2"
tauri-plugin-notification = "2.5.1"
souvlaki = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# HTTP client with retry logic
# Preserve the native TLS, text decoding, HTTP/2, and system proxy behavior of 0.11.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "query", "form"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "query"] }
reqwest-retry = "0.9.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# URL handling
url = "2.5"

# Cryptography
md-5 = "0.10"
sha1 = "0.10"

# Utilities
once_cell = "1.19"
uuid = { version = "1", features = ["v4"] }
roxmltree = "0.21"
scraper = "0.27"
crossbeam-channel = "0.5"

# SQLite database
rusqlite = { version = "0.40", features = ["bundled"] }

# Cross-platform audio device enumeration & playback
cpal = "0.15"

# Audio decoding — native AAC excluded (fdk-aac adapter replaces it with HE-AAC support)
symphonia = { version = "0.5", default-features = false, features = [
    "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",  # codecs (no "aac")
    "caf", "isomp4", "mkv", "ogg", "aiff", "wav",                    # formats
] }
symphonia-adapter-libopus = "0.2"
symphonia-adapter-fdk-aac = "0.1"

# EBU R128 loudness analysis (for Opus tracks where Plex lacks proper loudness data)
ebur128 = "0.1"

# FFT for visualizer frequency analysis
realfft = "3.5"
rubato = "5"
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
